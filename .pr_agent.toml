# .pr_agent.toml
# See https://github.com/Codium-ai/pr-agent/blob/main/pr_agent/settings/configuration.toml

[config]

output_relevant_configurations = true
model = "gpt-4o-mini"
model_turbo = "gpt-4o-mini"
fallback_models = ["gpt-4o-mini"]
max_model_tokens = 8192
git_provider = "gitlab"
verbosity_level = 0

[pr_reviewer] # /review #

enable_help_text = false
extra_instructions = """\
Focus on suggestions that truly improve the code, keeping feedback concise, constructive, and respectful.

Prioritize feedback on those essential aspects:
- Reliability / edge case coverage
- Performance efficiency
- Security
- Maintainability, clarity and readability

That means ensuring adherence to best practices (e.g. SOLID, KISS, DRY).

Please also recommend unit tests for non-trivial, isolated logic, and integration tests if backend flows need verification.

Suggest improving code clarity over adding redundant comments -- clear naming and modularity are preferred.
"""
require_score_review = true

[pr_description] # /describe #

enable_help_text = false
enable_help_comment = false
