########~~~~-- Stages --~~~~########

stages:
  - Test
  - Analyze
  - Describe and review
  - Publish
  - Update dependencies

########~~~~-- Variables & defaults --~~~~########

default:
  image: node:22

########~~~~-- Jobs --~~~~########

run_integration_tests:
  stage: Test
  variables:
    API_PORT: 9124
    HOST_URL: http://localhost:9124
    TRUSTED_ORIGINS: http://localhost:8477
  before_script:
    - npm ci
    - npm install -g newman
    - npm run build
    - npm start & sleep 10
  script: npm run run-integration-tests
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'

run_unit_tests_then_analyze:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: Analyze
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
    GIT_DEPTH: '0' # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: '${CI_JOB_NAME}'
    paths: [.sonar/cache]
  script:
    - git config --global --add safe.directory /builds/beavuck-services/time
    - LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then PROJECT_VERSION=$LATEST_TAG; else PROJECT_VERSION=$LATEST_TAG-$CI_MERGE_REQUEST_ID; fi
    - npm ci && npm test
    - sonar-scanner -Dsonar.projectVersion=$PROJECT_VERSION
  rules: [if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH']

describe_and_review:
  stage: Describe and review
  image:
    name: codiumai/pr-agent:latest
    entrypoint: [""]
  script:
    - if [[ "$CI_MERGE_REQUEST_LABELS" =~ (auto-generated|skip\ auto-review) ]]; then echo "Because of the labels of this MR, no AI review"; exit 0; fi
    - cd /app
    - echo "Creating code review..."
    - export gitlab__url=$CI_SERVER_PROTOCOL://$CI_SERVER_FQDN
    - export config__git_provider="gitlab"
    - export gitlab__PERSONAL_ACCESS_TOKEN=$PR_AGENT_TOKEN
    - export openai__key=$OPENAI_API_KEY
    - python -m pr_agent.cli --pr_url="${MR_URL}" describe
    - python -m pr_agent.cli --pr_url="${MR_URL}" review
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /auto-review/'
      needs: [run_unit_tests_then_analyze]
      when: on_success
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      needs: [run_unit_tests_then_analyze]
      when: manual
  allow_failure: true

publish:
  image: docker:latest
  stage: Publish
  services: [docker:dind]
  variables:
    TMP_SCRIPTS_DIR: /tmp/scripts
    IMAGE_NAME: 'beavuck/time'
    PUBLISH_TO_DOCKERHUB: 'true'
    PUBLISH_TO_GITLAB_REGISTRY: 'true'
  before_script:
    - apk add --no-cache bash
  script:
    - mkdir -p $TMP_SCRIPTS_DIR
    - git clone https://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST/beavuck-services/scripts/docker-publisher.git $TMP_SCRIPTS_DIR
    - cp $TMP_SCRIPTS_DIR/publish_docker_images.sh .
    - chmod +x publish_docker_images.sh
    - /bin/bash ./publish_docker_images.sh
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: run_integration_tests
      artifacts: true

update_dependencies:
  stage: Update dependencies
  variables:
    BRANCH_NAME: chore/update-dependencies
    COMMIT_MESSAGE: '⚙️ Update dependencies automatically'
    COMMAND: npm run update-dependencies && npm run up-patch
    TMP_SCRIPTS_DIR: /tmp/scripts
  before_script:
    - apt-get update && apt-get install -y bash curl jq
    - npm install -g npm-check-updates
  script:
    - mkdir -p $TMP_SCRIPTS_DIR
    - git clone https://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST/beavuck-services/scripts/command-runner-and-mr-creator.git $TMP_SCRIPTS_DIR
    - cp $TMP_SCRIPTS_DIR/run_command_and_create_mr.sh .
    - chmod +x run_command_and_create_mr.sh
    - /bin/bash ./run_command_and_create_mr.sh
  rules: [if: '$CI_PIPELINE_SOURCE == "schedule"']
