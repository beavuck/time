stages:
  - Test
  - Publish
  - Update dependencies

variables:
  MAIN_BRANCH: 'main'
  DOCKER_IMAGE_NAME: 'beavuck/time'

test:
  image: node:22
  stage: Test
  script:
    - npm ci
    - npm test
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: always

publish:
  image: docker:latest
  stage: Publish
  services:
    - docker:dind
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_WRITE_TOKEN"
    # push latest tag
    - docker build -t $DOCKER_IMAGE_NAME:latest .
    - docker push $DOCKER_IMAGE_NAME:latest
    # also push current tag
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: test
      artifacts: true

update_dependencies:
  image: node:22
  stage: Update dependencies
  variables:
    BRANCH_NAME: chore/update-dependencies
    COMMIT_MESSAGE: '⚙️ Update dependencies automatically'
  script:
    - npm ci
    - npm update --latest
    - npm audit fix
    - git config --global user.email "alexis@alexisdrai.com"
    - git config --global user.name "CI Bot"
    - |
      if git rev-parse --verify $BRANCH_NAME; then
        git branch -D $BRANCH_NAME
      fi
    - git checkout -b $BRANCH_NAME
    - git add .
    - |
      if ! git diff-index --quiet HEAD --; then
        git commit -m "$COMMIT_MESSAGE"
      else
        echo "No changes to commit."
        exit 0
      fi
    - git push https://gitlab-ci-token:$GITLAB_TOKEN@gitlab.com/$CI_PROJECT_PATH.git $BRANCH_NAME
    - >
      curl 
      --request POST 
      --header "PRIVATE-TOKEN: $GITLAB_TOKEN"
      --header "Content-Type: application/json"
      --data "{
        \"source_branch\": \"$BRANCH_NAME\",
        \"target_branch\": \"$MAIN_BRANCH\",
        \"title\": \"$COMMIT_MESSAGE\",
        \"assignee_id\": $GITLAB_USER_ID,
        \"remove_source_branch\": true,
        \"squash\": true
      }"
      "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  when: always
