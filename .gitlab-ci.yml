########~~~~-- Stages --~~~~########

stages:
  - secure
  - test
  - upgrade
  - build
  - deploy

########~~~~-- Variables & defaults --~~~~########

variables:
  IMAGE: "dhi.io/node:24-alpine3.23-dev"
  SCRIPT_TO_INSTALL_DEPS: "apk add --no-cache git bash curl jq && npm run safe-install:ci"

default:
  image: $IMAGE
  interruptible: true

########~~~~-- Workflows --~~~~########

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

########~~~~-- Includes --~~~~########

include:
  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/command-runner/command-runner@main"
    inputs:
      job_name: "format"
      stage_config: ".pre"
      branch_name: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      command: "npm run clean"
      commit_message: "🎨 Format code automatically"
      image: "$IMAGE"
      script_to_install_deps: "$SCRIPT_TO_INSTALL_DEPS"
      consecutive_command_commits_allowed: false

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/command-runner/command-runner@main"
    inputs:
      job_name: "upgrade"
      stage_config: "upgrade"
      branch_name: "chore/upgrade-dependencies"
      command: "npm run upgrade-dependencies && npm run up-patch"
      commit_message: "⚙️ Upgrade dependencies automatically"
      image: "$IMAGE"
      script_to_install_deps: "$SCRIPT_TO_INSTALL_DEPS"
      consecutive_command_commits_allowed: true

  - component: "$CI_SERVER_FQDN/beavuck-services/ci-cd-catalog/docker-publisher/docker-publisher@main"
    inputs:
      job_name: "publish_to_docker"
      stage_config: "deploy"
      image_name: "beavuck/time"
      publish_to_dockerhub: true

upgrade:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule' && $IS_UPGRADE == 'true'"

format:
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

publish_to_docker:
  rules:
    - if: "$CI_COMMIT_TAG"

########~~~~-- Job Templates --~~~~########

.install_glab:
  before_script:
    - |
      GLAB_VERSION=$(curl -fsSL "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases?per_page=1" \
        | grep -o '"tag_name":"[^"]*"' | head -1 | sed 's/.*:"\(.*\)"/\1/')
      curl -fsSL "https://gitlab.com/gitlab-org/cli/-/releases/${GLAB_VERSION}/downloads/glab_${GLAB_VERSION#v}_linux_amd64.tar.gz" \
        -o /tmp/glab.tar.gz
      tar xzf /tmp/glab.tar.gz -C /tmp/
      install -m755 /tmp/bin/glab /usr/local/bin/glab

########~~~~-- Jobs --~~~~########

find_secrets:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/gitguardian/ggshield:latest
  stage: secure
  script: ggshield secret scan ci
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

run_integration_tests:
  stage: test
  variables:
    BEAVUCK_TIME_API_PORT: 3000
    BEAVUCK_TIME_HOST_URL: http://localhost:3000
    BEAVUCK_TIME_TRUSTED_ORIGINS: http://localhost:8477
  before_script:
    - npm install --ignore-scripts --allow-git=none --min-release-age=10 -g npm@latest
    - npm run safe-install:ci
    - npm run build
    - npm start & sleep 10
  script: npm run run-integration-tests
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true

coverage:
  stage: test
  artifacts:
    paths: [coverage/lcov.info]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  before_script:
    - npm install --ignore-scripts --allow-git=none --min-release-age=10 -g npm@latest
    - npm run safe-install:ci
  script: npm run test
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true

analyze:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:latest"
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths: [.sonar/cache]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task
  script:
    - git config --global --add safe.directory "/builds/$CI_PROJECT_PATH"
    - LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then PROJECT_VERSION=$LATEST_TAG; else PROJECT_VERSION=$LATEST_TAG-$CI_MERGE_REQUEST_ID; fi
    - sonar-scanner -Dsonar.projectVersion=$PROJECT_VERSION
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
  needs:
    - job: find_secrets
      optional: true
    - job: coverage
      artifacts: true

publish_to_npm:
  stage: deploy
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install --ignore-scripts --allow-git=none --min-release-age=10 -g npm@latest
    - npm publish --access public
  rules:
    - if: "$CI_COMMIT_TAG"

release_time:
  stage: deploy
  image: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/debian:stable-slim"
  before_script:
    - apt update -y && apt install -y curl git
    - !reference [.install_glab, before_script]
  script:
    - PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^")
    - RELEASE_DESCRIPTION=$(bash scripts/list_changes.sh "$PREV_TAG" "$CI_COMMIT_TAG")
    - |
      ASSET_LINKS=$(printf '[
        {"name":"docker-image","url":"https://hub.docker.com/repository/docker/beavuck/time/tags?name=%s","link_type":"image"},
        {"name":"npm-package","url":"https://www.npmjs.com/package/beavuck-time/v/%s","link_type":"package"}
      ]' "$CI_COMMIT_TAG" "$CI_COMMIT_TAG")
    - glab release create "$CI_COMMIT_TAG" --name "$CI_COMMIT_TAG" --notes "$RELEASE_DESCRIPTION" --assets-links "$ASSET_LINKS"
  rules:
    - if: "$CI_COMMIT_TAG"
      needs: [ publish_to_docker, publish_to_npm ]
