stages:
  - Test
  - Analyze
  - Publish
  - Update dependencies

variables:
  GITLAB_CONTAINER_REGISTRY: 'registry.gitlab.com'
  GITLAB_DOCKER_IMAGE_PATH: '$GITLAB_CONTAINER_REGISTRY/beavuck-services/time'
  DOCKERHUB_DOCKER_IMAGE_NAME: 'beavuck/time'

run_integration_tests:
  image: node:22
  stage: Test
  variables:
    API_PORT: 9124
    HOST_URL: http://localhost:9124
    TRUSTED_ORIGINS: http://localhost:8477
  before_script:
    - npm ci
    - npm install -g newman
    - npm run build
    - npm start & sleep 10
  script:
    - npm run run-integration-tests
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

run_unit_tests_then_analyze:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  stage: Analyze
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
    GIT_DEPTH: '0' # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - git config --global --add safe.directory /builds/beavuck-services/time
    - LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
    - if [ "$CI_COMMIT_BRANCH" == "$MAIN_BRANCH" ]; then PROJECT_VERSION=$LATEST_TAG; else PROJECT_VERSION=$LATEST_TAG-$CI_MERGE_REQUEST_ID; fi
    - npm ci && npm test
    - sonar-scanner -Dsonar.projectVersion=$PROJECT_VERSION
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $MAIN_BRANCH'

publish:
  image: docker:latest
  stage: Publish
  services:
    - docker:dind
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_WRITE_TOKEN"
    # build image once
    - docker build -t $DOCKERHUB_DOCKER_IMAGE_NAME:$CI_COMMIT_TAG .
    # tag and push latest tag
    - docker tag $DOCKERHUB_DOCKER_IMAGE_NAME:$CI_COMMIT_TAG $DOCKERHUB_DOCKER_IMAGE_NAME:latest
    - docker push $DOCKERHUB_DOCKER_IMAGE_NAME:latest
    # tag and push major.minor version tag (if current tag is 2.0.10, push 2.0)
    - docker tag $DOCKERHUB_DOCKER_IMAGE_NAME:$CI_COMMIT_TAG $DOCKERHUB_DOCKER_IMAGE_NAME:$(echo $CI_COMMIT_TAG | cut -d. -f1-2)
    - docker push $DOCKERHUB_DOCKER_IMAGE_NAME:$(echo $CI_COMMIT_TAG | cut -d. -f1-2)
    # push the commit tag
    - docker push $DOCKERHUB_DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    # tag and push image to GitLab registry
    - docker login registry.gitlab.com -u "$GITLAB_USER_LOGIN" -p "$GITLAB_TOKEN"
    - docker tag $DOCKERHUB_DOCKER_IMAGE_NAME:$CI_COMMIT_TAG $GITLAB_DOCKER_IMAGE_PATH:$CI_COMMIT_TAG
    - docker push $GITLAB_DOCKER_IMAGE_PATH:$CI_COMMIT_TAG
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: run_integration_tests
      artifacts: true

update_dependencies:
  image: node:22
  stage: Update dependencies
  variables:
    BRANCH_NAME: chore/update-dependencies
    COMMIT_MESSAGE: '⚙️ Update dependencies automatically'
    COMMAND: npm run update-dependencies && npm run up-patch
    TMP_SCRIPTS_DIR: /tmp/scripts
  before_script:
    - apt-get update && apt-get install -y bash curl jq
    - npm install -g npm-check-updates
  script:
    - mkdir -p $TMP_SCRIPTS_DIR
    - git clone https://gitlab-ci-token:$GITLAB_TOKEN@$GITLAB_HOST/beavuck-services/scripts/command-runner-and-mr-creator.git $TMP_SCRIPTS_DIR
    - cp $TMP_SCRIPTS_DIR/run_command_and_create_mr.sh .
    - chmod +x run_command_and_create_mr.sh
    - /bin/bash ./run_command_and_create_mr.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
