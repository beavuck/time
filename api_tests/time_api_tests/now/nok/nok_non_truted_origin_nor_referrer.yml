info:
  name: nok_non_truted_origin_nor_referrer
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/now"
  headers:
    - name: Origin
      value: "{{NON_TRUSTED_ORIGIN}}"
    - name: Referrer
      value: "{{NON_RECOGNIZED_REFERRER}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.body
      operator: isDefined
    - expression: res.body.message
      operator: isDefined
    - expression: res.body.message
      operator: matches
      value: "{{CORS_REGEX}}"
    - expression: res.responseTime
      operator: lt
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
